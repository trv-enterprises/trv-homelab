---
# stream-display deployment tasks
# Chromium kiosk on a virtual X display, streamed as change-driven MJPEG,
# controlled over MQTT. Runs natively (no Docker) — Chromium comes from
# Playwright, not apt/snap.

- name: Validate every instance has a name and start URL
  ansible.builtin.fail:
    msg: "each stream_display_instances entry needs a non-empty name and start_url (set in host_vars)."
  loop: "{{ stream_display_instances }}"
  loop_control: { label: "{{ item.name | default('?') }}" }
  when: (item.name | default('')) == "" or (item.start_url | default('')) == ""

- name: Install system packages
  ansible.builtin.apt:
    name:
      - xvfb
      - ffmpeg
      - python3-venv
      - python3-pip
      - mesa-va-drivers
      - libva-drm2
      - fonts-dejavu-core
      - fonts-liberation
      - rsync
      - libturbojpeg
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Create stream-display system group
  ansible.builtin.group:
    name: "{{ stream_display_group }}"
    system: true
  become: true

- name: Create stream-display system user
  ansible.builtin.user:
    name: "{{ stream_display_user }}"
    group: "{{ stream_display_group }}"
    groups: video,render
    append: true
    system: true
    home: "{{ stream_display_deploy_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
  become: true

- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ stream_display_user }}"
    group: "{{ stream_display_group }}"
    mode: '0755'
  become: true
  loop:
    - "{{ stream_display_deploy_dir }}"
    - "{{ stream_display_browsers_path }}"
    - /etc/stream-display

- name: Sync stream-display source
  ansible.posix.synchronize:
    src: "{{ stream_display_src_dir }}/"
    dest: "{{ stream_display_deploy_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=venv"
      - "--exclude=profile"
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=browsers"
      - "--exclude=systemd/"
      - "--exclude=env.example"

- name: Fix ownership after sync
  ansible.builtin.file:
    path: "{{ stream_display_deploy_dir }}"
    owner: "{{ stream_display_user }}"
    group: "{{ stream_display_group }}"
    recurse: true
  become: true

- name: Check if venv exists
  ansible.builtin.stat:
    path: "{{ stream_display_deploy_dir }}/venv"
  register: stream_display_venv

- name: Create Python virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv venv
    chdir: "{{ stream_display_deploy_dir }}"
  become: true
  become_user: "{{ stream_display_user }}"
  when: not stream_display_venv.stat.exists

- name: Install Python dependencies
  ansible.builtin.pip:
    requirements: "{{ stream_display_deploy_dir }}/requirements.txt"
    virtualenv: "{{ stream_display_deploy_dir }}/venv"
  become: true
  become_user: "{{ stream_display_user }}"

# `playwright install --with-deps` installs missing OS packages for Chromium
# via apt, so the deps half needs root; the browser download itself is run
# with PLAYWRIGHT_BROWSERS_PATH pointed at a directory the stream user owns
# (created above) so the service can read the binaries it launches.
- name: Install Chromium via Playwright (with OS deps)
  ansible.builtin.command:
    cmd: "{{ stream_display_deploy_dir }}/venv/bin/playwright install --with-deps chromium"
  environment:
    PLAYWRIGHT_BROWSERS_PATH: "{{ stream_display_browsers_path }}"
  become: true
  register: playwright_install
  changed_when: "'Downloading' in playwright_install.stdout or 'Installing' in playwright_install.stdout"

- name: Fix browsers directory ownership after Playwright install
  ansible.builtin.file:
    path: "{{ stream_display_browsers_path }}"
    owner: "{{ stream_display_user }}"
    group: "{{ stream_display_group }}"
    recurse: true
  become: true

# --- templated systemd units (one pair serves all instances) ---
- name: Render templated systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  loop:
    - stream-xvfb@.service
    - stream-display@.service
  notify: Reload systemd

# --- retire the old single-instance units if upgrading from a pre-multi host ---
- name: Stop and disable the legacy single-instance units
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  become: true
  loop:
    - stream-display.service
    - stream-xvfb.service
  failed_when: false
  register: legacy_units

- name: Remove the legacy single-instance unit files and config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /etc/systemd/system/stream-display.service
    - /etc/systemd/system/stream-xvfb.service
    - /etc/stream-display/config.yaml
  notify: Reload systemd

# --- per-instance config, X-env, and services ---
- name: Render per-instance X environment (Xvfb display + geometry)
  ansible.builtin.template:
    src: xenv.j2
    dest: "/etc/stream-display/{{ inst.name }}.xenv"
    owner: "{{ stream_display_user }}"
    group: "{{ stream_display_group }}"
    mode: '0644'
  become: true
  loop: "{{ stream_display_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Render per-instance config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/etc/stream-display/{{ inst.name }}.yaml"
    owner: "{{ stream_display_user }}"
    group: "{{ stream_display_group }}"
    mode: '0644'
  become: true
  loop: "{{ stream_display_instances }}"
  loop_control: { loop_var: inst, label: "{{ inst.name }}" }

- name: Reload systemd before (re)starting instances
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Enable and (re)start each instance
  ansible.builtin.systemd:
    name: "{{ item.1 }}@{{ item.0.name }}.service"
    enabled: true
    state: restarted
  become: true
  loop: "{{ stream_display_instances | product(['stream-xvfb', 'stream-display']) | list }}"
  loop_control:
    label: "{{ item.1 }}@{{ item.0.name }}"

- name: Display deployment status
  ansible.builtin.debug:
    msg: |
      stream-display deployed successfully — {{ stream_display_instances | length }} instance(s):
      {% for i in stream_display_instances %}
        {{ i.name }}: Xvfb :{{ i.xdisplay | default(99) }}  ->  http://{{ ansible_host }}:{{ i.http_port | default(stream_display_http_port) }}/stream.mjpeg   (topics display/{{ i.name }}/*)
      {% endfor %}
      Commands:
        systemctl status 'stream-display@*'
        journalctl -u stream-display@<name> -f
