---
# Marshal deployment tasks
# Deploys rules.yaml and starts the marshal container

- name: Validate rules file variable
  ansible.builtin.fail:
    msg: "marshal_rules_file is required. Pass via -e 'marshal_rules_file=path/to/rules.yaml'"
  when: marshal_rules_file is not defined or marshal_rules_file == ""

- name: Deploy rules.yaml
  ansible.builtin.copy:
    src: "{{ marshal_rules_file }}"
    dest: "{{ services_deploy_dir }}/rules.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  become: true
  register: rules_file_result

- name: Pull latest marshal image
  ansible.builtin.command:
    cmd: docker compose pull marshal
    chdir: "{{ services_deploy_dir }}"
  register: pull_result
  changed_when: "'Downloaded' in pull_result.stderr or 'Pulled' in pull_result.stderr"

- name: Start/update marshal
  ansible.builtin.command:
    cmd: docker compose up -d marshal
    chdir: "{{ services_deploy_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

# rules.yaml is a SINGLE-FILE bind mount, and the copy above replaces the file
# (write temp, rename), so it has a new inode. A container that is already
# running keeps the old one and never sees the new rules. SIGHUP cannot help:
# the path inside the container still resolves to the old file. Only starting
# the container again re-resolves the mount.
#
# `up -d` does that on its own when the image or the service definition
# changed, which is why this went unnoticed while every rules change shipped
# with a version bump. A rules-only deploy needs the explicit restart.
- name: Restart marshal to load changed rules
  ansible.builtin.command:
    cmd: docker compose restart marshal
    chdir: "{{ services_deploy_dir }}"
  when:
    - rules_file_result.changed
    - "'Started' not in compose_up.stderr"
    - "'Recreated' not in compose_up.stderr"
  changed_when: true

# sentinel mounts the same file read-only (rule list, repeat windows) and is
# stale for the same reason. It is optional in this stack, so only restart it
# where it is running.
- name: Check whether sentinel is running
  ansible.builtin.command:
    cmd: docker compose ps --status running -q sentinel
    chdir: "{{ services_deploy_dir }}"
  register: sentinel_running
  when: rules_file_result.changed
  changed_when: false
  failed_when: false

- name: Restart sentinel to load changed rules
  ansible.builtin.command:
    cmd: docker compose restart sentinel
    chdir: "{{ services_deploy_dir }}"
  when:
    - rules_file_result.changed
    - (sentinel_running.stdout | default('') | trim | length) > 0
  changed_when: true

- name: Wait for marshal to start
  ansible.builtin.command:
    cmd: docker compose ps marshal --format json
    chdir: "{{ services_deploy_dir }}"
  register: compose_ps
  until: "'running' in compose_ps.stdout"
  retries: 6
  delay: 5
  changed_when: false

- name: Show recent logs
  ansible.builtin.command:
    cmd: docker compose logs --tail=10 marshal
    chdir: "{{ services_deploy_dir }}"
  register: engine_logs
  changed_when: false

- name: Display deployment status
  ansible.builtin.debug:
    msg: |
      Marshal deployed successfully!
      Image: {{ marshal_image }}:{{ marshal_version }}
      Rules: {{ marshal_rules_file }}
      Recent logs:
      {{ engine_logs.stdout }}

- name: Configure Zigbee on-device rules
  ansible.builtin.include_tasks: zigbee-device-rules.yml
  when: zigbee_device_rules | length > 0
