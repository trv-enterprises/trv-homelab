---
# Dashboard role defaults.
#
# These are LOW precedence on purpose: inventory host_vars override them.
# Host/environment-specific knobs (domain, HTTPS) MUST live here, not in
# vars/main.yml — role vars/ outranks host_vars and can't be overridden
# per-host. (Learned 2026-06-10 when a vars/ dashboard_domain silently kept
# pre-prod on :80 despite the host_var.)

# Caddy site address.
# ":80" forces HTTP-only (no TLS). A bare IP or hostname triggers Caddy
# automatic HTTPS; for a bare IP, Caddy 2.x uses its INTERNAL (self-signed) CA
# — that is the pre-prod path. Prod (LXC 100) keeps ":80".
dashboard_domain: ":80"

# HTTPS toggle. Default false: prod stays HTTP-only and the template is a no-op
# (443 unpublished, CORS list unchanged byte-for-byte). Pre-prod (LXC 104)
# sets this true in host_vars and points dashboard_domain at its IP, so Caddy
# serves TLS off its internal CA. When true, the template publishes 443 and
# appends https://<ansible_host>[,https://<lan_ip>] to the server CORS list.
dashboard_enable_https: false

# TLS cert-source directive injected into the client image's Caddyfile via the
# CADDY_TLS_DIRECTIVE env (outpost-client >= build 1964 / commit 5deb552). Empty
# default => no directive (HTTP-only, or public ACME for a real public DOMAIN);
# prod (LXC 100) unaffected. Set in host_vars for an HTTPS box, e.g. the
# Tailscale path: "tls { get_certificate tailscale }" with a .ts.net DOMAIN.
# Only takes effect when dashboard_enable_https is also true; when set, the
# template also bind-mounts the tailscaled socket into the caddy container.
# NOTE: do NOT use a bare-IP DOMAIN with HTTPS — the IP-SAN cert is rejected by
# Chromium/Firefox at the handshake. Always a hostname.
dashboard_caddy_tls_directive: ""

# ---------------------------------------------------------------------------
# Home-screen launcher sidecar (/launch)
# ---------------------------------------------------------------------------
# Serves a per-user PWA manifest so iOS "Add to Home Screen" pins an icon that
# carries an identity. Needed because the dashboard's own manifest hardcodes
# start_url:"/" and iOS gives an installed PWA a storage jar separate from
# Safari's — so the dashboard's localStorage identity is invisible to the
# installed app and every cold launch asks who you are.
#
# Requires legacy GUID auth (DASHBOARD_AUTH_ALLOW_LEGACY_GUID), since the
# launcher hands identity to the app via ?user_id=. Deliberately off by
# default: enable per-host in homelab-deploy inventory, and only on a
# LAN/tailnet-only deployment. Anyone who can reach /launch can assume any
# identity listed in its users.json.
dashboard_launcher_enabled: false

# Static content served at /launch, deployed from homelab-deploy:
#   files/dashboard-launcher/{index.html,users.json,Caddyfile}
dashboard_launcher_src: ""
dashboard_launcher_image: "caddy:2-alpine"
