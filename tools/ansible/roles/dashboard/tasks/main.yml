---
# Dashboard deployment tasks

# Version resolution. Mirrors the tsstore role: empty dashboard_version means
# "track the latest release", a concrete value pins. Without this, the role
# carried a hardcoded version that went stale and silently downgraded prod.
- name: Determine whether dashboard_version is pinned
  ansible.builtin.set_fact:
    dashboard_version_pinned: "{{ (dashboard_version | default('') | length) > 0 }}"

- name: Resolve latest dashboard release (only when version not pinned)
  ansible.builtin.command:
    cmd: gh release view --repo trv-enterprises/trv-outpost --json tagName --jq .tagName
  delegate_to: localhost
  run_once: true
  # Read-only lookup — must run even in --check so the resolved version is
  # available to the (checked) template/pull tasks.
  check_mode: false
  register: dashboard_latest_lookup
  changed_when: false
  failed_when: >-
    dashboard_latest_lookup.rc != 0 or
    (dashboard_latest_lookup.stdout | default('') | trim | length) == 0
  when: not dashboard_version_pinned

- name: Set dashboard_version from the resolved release
  ansible.builtin.set_fact:
    # GHCR tags carry no 'v' prefix; GitHub release tags may. Strip it.
    dashboard_version: "{{ dashboard_latest_lookup.stdout | trim | regex_replace('^v', '') }}"
  when: not dashboard_version_pinned

- name: Show the version being deployed
  ansible.builtin.debug:
    msg: >-
      Deploying dashboard {{ dashboard_version }}
      ({{ 'pinned' if dashboard_version_pinned else 'resolved as latest release' }})

- name: Validate an Anthropic key is available for AI features
  ansible.builtin.fail:
    msg: >-
      An Anthropic key is required for the dashboard AI features. Provide ONE of:
      ASSISTANT_ANTHROPIC_API_KEY (deploy-time env, preferred) or anthropic_api_key
      (vault / --extra-vars).
  when: >
    (assistant_anthropic_api_key is not defined or assistant_anthropic_api_key == "") and
    (anthropic_api_key is not defined or anthropic_api_key == "")

- name: Validate GHCR token
  ansible.builtin.fail:
    msg: "ghcr_token is required for pulling from GitHub Container Registry. Pass via --extra-vars or set TOM_GH_TOKEN env var."
  when: ghcr_token is not defined or ghcr_token == ""

- name: Create deployment directory
  ansible.builtin.file:
    path: "{{ dashboard_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: true

- name: Login to GitHub Container Registry
  ansible.builtin.shell:
    cmd: echo "{{ ghcr_token }}" | docker login ghcr.io -u trv-enterprises --password-stdin
  register: docker_login
  changed_when: false
  no_log: true

- name: Validate launcher source is configured
  ansible.builtin.fail:
    msg: >-
      dashboard_launcher_enabled is true but dashboard_launcher_src is unset.
      Point it at the launcher content in homelab-deploy, e.g.
      dashboard_launcher_src: "{{ '{{ inventory_dir }}' }}/../files/dashboard-launcher"
      (anchor on inventory_dir, not playbook_dir — the playbooks live in the
      sibling trv-homelab checkout).
  when:
    - dashboard_launcher_enabled | default(false)
    - dashboard_launcher_src | default('') == ''
  tags:
    - launcher

# The launcher hands identity to the app via ?user_id=, which the server only
# honors when legacy GUID auth is on. Enabling the launcher without it would
# deploy a page that silently fails to sign anyone in.
- name: Validate launcher has a working auth channel
  ansible.builtin.fail:
    msg: >-
      dashboard_launcher_enabled requires dashboard_auth_allow_legacy_guid to be
      true — the launcher signs in via ?user_id=, which the server ignores when
      legacy GUID auth is off. Enable it, or disable the launcher.
  when:
    - dashboard_launcher_enabled | default(false)
    - (dashboard_auth_allow_legacy_guid | default('true')) | string | lower != 'true'
  tags:
    - launcher

- name: Create launcher content directory
  ansible.builtin.file:
    path: "{{ dashboard_deploy_dir }}/launcher"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: true
  when: dashboard_launcher_enabled | default(false)
  tags:
    - launcher

- name: Deploy launcher content
  ansible.builtin.copy:
    src: "{{ dashboard_launcher_src }}/{{ item }}"
    dest: "{{ dashboard_deploy_dir }}/launcher/{{ item }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop:
    - Caddyfile
    - index.html
    - users.json
  register: launcher_content
  when: dashboard_launcher_enabled | default(false)
  tags:
    - launcher

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ dashboard_deploy_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  register: compose_file

- name: Pull latest images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ dashboard_deploy_dir }}"
  register: pull_result
  changed_when: "'Downloaded' in pull_result.stderr or 'Pulled' in pull_result.stderr"

- name: Start/update dashboard services
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ dashboard_deploy_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

# Launcher content is bind-mounted, so `compose up -d` sees no config change
# and leaves the running container with the old files. Restart explicitly when
# the content actually changed.
#
# Uses `up -d launcher` rather than `restart`: on a content-only run
# (--tags launcher) the compose-up task above is skipped, so the container may
# not exist yet and `restart` would fail. `up -d` creates it if missing and is
# a no-op restart otherwise.
- name: Restart launcher when its content changed
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate launcher
    chdir: "{{ dashboard_deploy_dir }}"
  when:
    - dashboard_launcher_enabled | default(false)
    - launcher_content is changed
  changed_when: true
  tags:
    - launcher

- name: Wait for services to be healthy
  ansible.builtin.command:
    cmd: docker compose ps --format json
    chdir: "{{ dashboard_deploy_dir }}"
  register: compose_ps
  until: "'unhealthy' not in compose_ps.stdout and 'starting' not in compose_ps.stdout"
  retries: 12
  delay: 10
  changed_when: false

- name: Display deployment status
  ansible.builtin.debug:
    msg: |
      Dashboard deployed successfully!
      Version: {{ dashboard_version }}
      URL: https://{{ ansible_host }}/ (or http://{{ lan_ip | default(ansible_host) }}/)
