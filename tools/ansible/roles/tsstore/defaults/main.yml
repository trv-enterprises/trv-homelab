---
# Defaults — overrideable in inventory/host_vars/<host>.yml.
# (Role-internal constants live in vars/main.yml, which has higher
# precedence than host_vars and is therefore unsuitable for things
# the operator is expected to set per host.)

# Release version. Must match a tag in trv-enterprises/ts-store with
# release assets named <binary>-<version>-linux-<arch>.
#
# EMPTY = "resolve the latest release at deploy time" (the role queries
# GitHub via the gh CLI and uses the newest tag, e.g. v0.17.0). Set a concrete
# value here, in host_vars, or via -e/TSSTORE_VERSION to PIN a version instead.
# There is deliberately no stale numeric fallback — an un-pinned deploy always
# tracks the current release rather than a hardcoded old one.
tsstore_version: ""

# Collectors to enable (override per host).
# Only Go collectors shipped in the ts-store release are supported here.
# Currently: system-stats, journal-logs. (sensehat is a separate Python
# service in the utilities repo — not deployed by this role.)
tsstore_collectors: []
# Example:
# tsstore_collectors:
#   - name: system-stats
#     interval: 20
#   - name: journal-logs

# MQTT push streams (override per host).
# Rendered into mqtt_connections.json inside each store's data dir.
tsstore_mqtt_streams: []

# Per-store API keys, keyed by hyphenated store name.
# Values are typically vault references like "{{ pi001_system_stats_api_key }}".
# The role preserves these across re-deploys via SHA-256 of the key in keys.json.
tsstore_store_api_keys: {}

# Server-side stores that have NO local collector on this ts-store host —
# they are written to REMOTELY (e.g. the docker-stats collector on LXC 100
# writes to dashboard-docker-* on trv-srv-002 over HTTP). List store names
# here to have the role create them, seed keys.json, and apply their schema,
# exactly as it does for collector-backed stores. Each name must have a spec
# in tsstore_collector_store_specs (vars/main.yml) and an API key in
# tsstore_store_api_keys. Example (in host_vars):
#   tsstore_server_stores:
#     - dashboard-docker-containers
#     - dashboard-docker-daemon
tsstore_server_stores: []

# Per-store creation overrides, keyed by store name. Merged over the
# role's tsstore_collector_store_specs (vars/main.yml) so a host can
# override type/blocks/schema for a store without editing the role.
# Usually left empty. Example:
#   tsstore_store_specs:
#     system-stats: {type: json, blocks: 20000}
tsstore_store_specs: {}

# ── docker-stats collector (tasks/docker-stats.yml) ────────────────────────
# Deployed on a Docker host via playbooks/docker-stats-deploy.yml; writes to a
# remote ts-store over HTTP. These are only consumed when that task file runs.
docker_stats_user: docker-stats
docker_stats_bin: /usr/local/bin/docker-stats
# Where the ts-store repo's examples/docker-stats source lives on the control
# node, and where the locally-built binary is dropped.
docker_stats_src_dir: "{{ playbook_dir }}/../../../../ts-store/examples/docker-stats"
docker_stats_build_dir: "{{ playbook_dir }}/../../../../ts-store/examples/docker-stats"
docker_stats_container_interval: 20
docker_stats_daemon_interval: 120
# docker_stats_http / _container_store / _daemon_store / _container_key /
# _daemon_key have no safe defaults — the playbook or host_vars must set them.

# ── synology-snmp collector (tasks/synology-snmp.yml) ──────────────────────
# Deployed on a POLLER host (services LXC) via
# playbooks/synology-snmp-deploy.yml. Polls a Synology NAS over SNMPv3 and
# writes to a remote ts-store over HTTP. Nothing is installed on the NAS.
#
# NOTE the two distinct "user" vars — they are unrelated and easy to confuse:
#   synology_snmp_user       the LOCAL unix service account on the poller host
#   synology_snmp_user_name  the SNMPv3 security name on the NAS (vault ref)
synology_snmp_user: synology-snmp
synology_snmp_bin: /usr/local/bin/synology-snmp
# examples/synology-snmp is a SEPARATE Go module (needs gosnmp for SNMPv3
# USM), so the build must run from inside this dir, not from the repo root.
synology_snmp_src_dir: "{{ playbook_dir }}/../../../../ts-store/examples/synology-snmp"
synology_snmp_build_dir: "{{ playbook_dir }}/../../../../ts-store/examples/synology-snmp"
# Poll interval in seconds. Override per host in host_vars, or at the command
# line with -e synology_snmp_interval=<n> (make deploy-synology-snmp
# SYNOLOGY_SNMP_INTERVAL=<n>). Disk temps and RAID state move slowly; 60s is
# a third the storage of 20s for no loss of signal.
synology_snmp_interval: 60
# synology_snmp_target / _http / _store_prefix / _user_name / _auth_pass /
# _priv_pass / _disks_key / _volumes_key / _system_key have no safe defaults —
# the playbook or host_vars must set them.
