---
# tsstore role internal constants.
# Things the operator might want to override per host live in defaults/main.yml,
# not here — vars/ has higher precedence than host_vars.

# Service identity. Service user is created by the role if missing.
tsstore_user: tsstore
tsstore_group: tsstore

# Binary locations
tsstore_bin_dir: /usr/local/bin
tsstore_data_dir: /var/lib/tsstore
tsstore_run_dir: /var/run/tsstore
tsstore_config_dir: /etc/tsstore

# Service configuration
tsstore_port: 21080
tsstore_socket: "{{ tsstore_run_dir }}/tsstore.sock"

# Release-asset download base. Combined with tsstore_version (from defaults)
# and the per-binary name + arch suffix.
tsstore_release_url_base: "https://github.com/trv-enterprises/ts-store/releases/download"

# Recognized Go collectors. The role fails fast if tsstore_collectors
# contains a name not in this list (prevents typos and stops attempts to
# install non-existent binaries like sensehat).
tsstore_known_collectors:
  - system-stats
  - journal-logs

# Per-collector store specifications. The role creates each collector's
# store on first deploy (when meta.tsdb is absent) using these settings,
# then — for schema-type stores — applies the schema via the API before
# the collector starts writing.
#
# IMPORTANT: a schema store rejects any field the collector emits that
# isn't declared here ("field not found in schema"). This schema MUST cover
# every field the collector binary at tsstore_version emits. Capture the
# live set with `system-stats -stdout -interval 1` after a version bump and
# add any new field NAMES below.
#
# The role reconciles this against each existing store BY NAME (see
# tasks/main.yml): missing names are APPENDED at the next free index (safe,
# non-destructive); a rename/retype/reuse of an existing index FAILS the
# play loudly (breaking — would need a store recreation). The `index`
# values here define the canonical layout for FRESH stores only; existing
# stores keep whatever indices/types they already have for shared names
# (e.g. trv-srv-002 created temp.nvme_c at index 18/float64; trv-srv-001 at
# 20/float32 — both fine, reconcile keys on name not index).
#
# These role-internal defaults can be overridden per host via
# tsstore_store_specs in host_vars (see defaults/main.yml).
tsstore_collector_store_specs:
  system-stats:
    type: schema
    blocks: 10000
    # Field set verified against system-stats v0.6.8 (-stdout output).
    # Temps are float32 (matches the live v0.6.8 store on trv-srv-001).
    schema:
      fields:
        - {index: 1, name: "cpu.pct", type: "int32"}
        - {index: 2, name: "memory.total", type: "int64"}
        - {index: 3, name: "memory.used", type: "int64"}
        - {index: 4, name: "memory.available", type: "int64"}
        - {index: 5, name: "memory.pct", type: "int32"}
        - {index: 6, name: "disk_io.read_bytes_sec", type: "int64"}
        - {index: 7, name: "disk_io.write_bytes_sec", type: "int64"}
        - {index: 8, name: "network.rx_bytes_sec", type: "int64"}
        - {index: 9, name: "network.tx_bytes_sec", type: "int64"}
        - {index: 10, name: "disk_space.total", type: "int64"}
        - {index: 11, name: "disk_space.used", type: "int64"}
        - {index: 12, name: "disk_space.available", type: "int64"}
        - {index: 13, name: "disk_space.pct", type: "int32"}
        - {index: 14, name: "swap.total", type: "int64"}
        - {index: 15, name: "swap.used", type: "int64"}
        - {index: 16, name: "swap.pct", type: "int32"}
        - {index: 17, name: "uptime.sec", type: "int64"}
        - {index: 18, name: "temp.cpu_package_c", type: "float32"}
        - {index: 19, name: "temp.cpu_max_core_c", type: "float32"}
        - {index: 20, name: "temp.nvme_c", type: "float32"}
        - {index: 21, name: "temp.pch_c", type: "float32"}
        - {index: 22, name: "temp.nic_c", type: "float32"}
  # journal-logs ships free-form log lines; a json store needs no schema
  # and tolerates field changes across releases. (No schema block ⇒ the
  # role skips the schema PUT for this store.)
  journal-logs:
    type: json
    blocks: 10000

  # docker-stats collector stores (ts-store examples/docker-stats). The
  # collector runs on a Docker host and writes to a ts-store — either
  # REMOTELY over HTTP (LXCs on trv-srv-002 → the srv-002 store, via that
  # host's tsstore_server_stores) or LOCALLY via socket (hosts that run their
  # own ts-store, e.g. simulators / trv-srv-001).
  #
  # Naming convention: <docker-host>-docker-containers / <docker-host>-docker-daemon
  # so multiple Docker hosts can share one ts-store, separated by store name
  # (per the docker-stats README). <docker-host> is the inventory hostname.
  #
  # Every docker host uses the SAME two schemas (the metric set is fixed;
  # adding/removing a CONTAINER needs no schema change — a new container just
  # appears as new rows with a new `container` value). To avoid repeating the
  # field lists per host, the two schemas are defined ONCE as YAML anchors
  # (&docker_containers_schema / &docker_daemon_schema) and aliased per host.
  # Schemas are verbatim from the docker-stats README.
  dashboard-docker-containers: &docker_containers_spec
    type: schema
    blocks: 20000
    schema:
      fields:
        - {index: 1,  name: "container",         type: "string"}
        - {index: 2,  name: "image",             type: "string"}
        - {index: 3,  name: "state",             type: "string"}
        - {index: 4,  name: "cpu.pct",           type: "float64"}
        - {index: 5,  name: "mem.used",          type: "int64"}
        - {index: 6,  name: "mem.limit",         type: "int64"}
        - {index: 7,  name: "mem.pct",           type: "float64"}
        - {index: 8,  name: "net.rx_bytes",      type: "int64"}
        - {index: 9,  name: "net.tx_bytes",      type: "int64"}
        - {index: 10, name: "blkio.read_bytes",  type: "int64"}
        - {index: 11, name: "blkio.write_bytes", type: "int64"}
        - {index: 12, name: "pids",              type: "int32"}
  dashboard-docker-daemon: &docker_daemon_spec
    type: schema
    blocks: 2000
    schema:
      fields:
        - {index: 1, name: "containers.running", type: "int32"}
        - {index: 2, name: "containers.paused",  type: "int32"}
        - {index: 3, name: "containers.stopped", type: "int32"}
        - {index: 4, name: "containers.total",   type: "int32"}
        - {index: 5, name: "images.total",       type: "int32"}
        - {index: 6, name: "df.layers_size",     type: "int64"}
        - {index: 7, name: "df.images_size",     type: "int64"}
        - {index: 8, name: "df.containers_size", type: "int64"}
        - {index: 9, name: "df.volumes_size",    type: "int64"}

  # Additional Docker hosts — same two schemas, aliased from the anchors above.
  # Remote-write (→ trv-srv-002 store over HTTP): services, nvr, photos,
  # dashboard-preprod. Local-write (own ts-store via socket): simulators,
  # trv-srv-001. A host's store pair is only created where it's listed in
  # tsstore_server_stores (remote target) or tsstore_collectors-adjacent
  # local config; defining the spec here is harmless for hosts that don't use it.
  services-docker-containers: *docker_containers_spec
  services-docker-daemon: *docker_daemon_spec
  nvr-docker-containers: *docker_containers_spec
  nvr-docker-daemon: *docker_daemon_spec
  photos-docker-containers: *docker_containers_spec
  photos-docker-daemon: *docker_daemon_spec
  dashboard-preprod-docker-containers: *docker_containers_spec
  dashboard-preprod-docker-daemon: *docker_daemon_spec
  simulators-docker-containers: *docker_containers_spec
  simulators-docker-daemon: *docker_daemon_spec
  trv-srv-001-docker-containers: *docker_containers_spec
  trv-srv-001-docker-daemon: *docker_daemon_spec

  # synology-snmp collector stores (ts-store examples/synology-snmp). The
  # collector runs on the services LXC and polls the NAS over SNMPv3, then
  # writes REMOTELY over HTTP to the trv-srv-002 store. Nothing is installed
  # on the NAS itself.
  #
  # Naming: <nas-host>-{disks,volumes,system}, same <host>-<stream> convention
  # as the docker stores, so several NAS devices can share one ts-store.
  #
  # SHAPE: SNMP tables are flat OID columns, not nested arrays, so a table
  # walk becomes TALL rows keyed by a discriminator — `disk` and `volume`
  # here, exactly like `container` in the docker stores. Adding or replacing
  # a disk needs NO schema change; it just appears as rows with a new `disk`
  # value. The system stream is WIDE: one row per poll.
  #
  # ENUMS ARE RAW INTEGERS ON PURPOSE. status/health/*_status are stored as
  # the integer SNMP returns, never a decoded string. Synology extends these
  # enums between releases without reissuing the MIB bundle (the 2022 MIB
  # caps raidStatus at Integer32(1..12); the 2025 guide documents 20 states,
  # including the SHR-specific 18 and 20 — and this NAS runs SHR-2). A string
  # field would need a retype on every such addition, and a retype means
  # recreating the store and losing history. Decode at read time instead:
  # trv-homelab/edge/synology-snmp/oid-map.yml carries the enum tables.
  nas-syn-002-disks: &synology_disks_spec
    type: schema
    blocks: 20000
    schema:
      fields:
        - {index: 1, name: "disk",      type: "string"}
        - {index: 2, name: "model",     type: "string"}
        - {index: 3, name: "disk_type", type: "string"}
        - {index: 4, name: "status",    type: "int32"}
        - {index: 5, name: "temp_c",    type: "int32"}
        - {index: 6, name: "role",      type: "string"}
        - {index: 7, name: "health",    type: "int32"}
  nas-syn-002-volumes: &synology_volumes_spec
    type: schema
    blocks: 10000
    schema:
      fields:
        - {index: 1, name: "volume",       type: "string"}
        - {index: 2, name: "status",       type: "int32"}
        # Counter64 bytes — int64, not int32: an 8 TB volume overflows int32
        # by three orders of magnitude.
        - {index: 3, name: "free_bytes",   type: "int64"}
        - {index: 4, name: "total_bytes",  type: "int64"}
        - {index: 5, name: "hotspare_cnt", type: "int32"}
  nas-syn-002-system: &synology_system_spec
    type: schema
    blocks: 10000
    schema:
      fields:
        - {index: 1,  name: "system_status",   type: "int32"}
        - {index: 2,  name: "temp_c",          type: "int32"}
        - {index: 3,  name: "power_status",    type: "int32"}
        - {index: 4,  name: "fan_system",      type: "int32"}
        - {index: 5,  name: "fan_cpu",         type: "int32"}
        - {index: 6,  name: "upgrade_avail",   type: "int32"}
        # UPS: status is a DisplayString ("OL"), NOT an enum. The two
        # percentages arrive as ASN.1 Opaque-wrapped floats.
        - {index: 7,  name: "ups_status",      type: "string"}
        - {index: 8,  name: "ups_load_pct",    type: "float64"}
        - {index: 9,  name: "ups_battery_pct", type: "float64"}
        # laLoadInt is load average x100; the collector divides before write.
        - {index: 10, name: "load1",           type: "float64"}
        - {index: 11, name: "load5",           type: "float64"}
        - {index: 12, name: "load15",          type: "float64"}
        - {index: 13, name: "mem_total_kb",    type: "int64"}
        - {index: 14, name: "mem_avail_kb",    type: "int64"}
        - {index: 15, name: "mem_cached_kb",   type: "int64"}
