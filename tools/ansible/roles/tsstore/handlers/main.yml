---
# tsstore handlers

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart tsstore
  ansible.builtin.systemd:
    name: tsstore
    state: restarted
  become: true

- name: Restart system-stats
  ansible.builtin.systemd:
    name: system-stats
    state: restarted
  become: true

- name: Restart journal-logs
  ansible.builtin.systemd:
    name: journal-logs
    state: restarted
  become: true

- name: Restart docker-stats
  ansible.builtin.systemd:
    name: docker-stats
    state: restarted
  become: true

- name: Restart synology-snmp
  ansible.builtin.systemd:
    name: synology-snmp
    state: restarted
  become: true

- name: Restart nightlight-motion
  ansible.builtin.systemd:
    name: nightlight-motion
    state: restarted
  become: true
