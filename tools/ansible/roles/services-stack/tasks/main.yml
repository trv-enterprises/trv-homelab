---
# Services stack deployment tasks
# Deploys the shared docker-compose.yml for the services LXC

- name: Validate GHCR token
  ansible.builtin.fail:
    msg: "ghcr_token is required for pulling from GitHub Container Registry."
  when: ghcr_token is not defined or ghcr_token == ""

- name: Login to GitHub Container Registry
  ansible.builtin.shell:
    cmd: echo "{{ ghcr_token }}" | docker login ghcr.io -u trv-enterprises --password-stdin
  register: docker_login
  changed_when: false
  no_log: true

- name: Create services deployment directory
  ansible.builtin.file:
    path: "{{ services_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: true

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ services_deploy_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  become: true
  register: compose_file

- name: Deploy mosquitto.conf
  ansible.builtin.copy:
    src: mosquitto.conf
    dest: "{{ services_deploy_dir }}/mosquitto.conf"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  become: true
  register: mosquitto_config_file

# autoheal restarts containers that report unhealthy. It belongs to the stack
# rather than to any one service: Docker marks health status but never acts on
# it, so without this every healthcheck in this file is only a label on
# `docker ps`.
#
# Started here because no service role owns it, and because the per-service
# roles each run `docker compose up -d <their-service>`, which would never
# bring it up. It restarts only containers labelled autoheal=true.
- name: Start/update autoheal
  ansible.builtin.command:
    cmd: docker compose up -d autoheal
    chdir: "{{ services_deploy_dir }}"
  register: autoheal_up
  changed_when: "'Started' in autoheal_up.stderr or 'Recreated' in autoheal_up.stderr"
