---
# sentinel deployment defaults (lowest precedence: host_vars in the deploy inventory override these)

ghcr_registry: ghcr.io/trv-enterprises
sentinel_image: "{{ ghcr_registry }}/sentinel"
sentinel_version: latest

# Deployment directory (shared services stack)
services_deploy_dir: /opt/services

# Defaults; override from the deployment inventory (host_vars/services.yml)
mqtt_broker: "tcp://mosquitto:1883"
sentinel_http_port: 8070
frigate_url: "http://192.168.1.156:5000"
sentinel_retention: "720h"
# People (0.7.0). The owner is whoever sentinel_api_token belongs to; on the
# first start of 0.7.0 they adopt the mutes, policies, quiet hours and phones
# the server already had, under this id. Choose it before that first deploy:
# renaming it later leaves those settings under the old id.
sentinel_owner: "owner"
# Everyone else, id -> token (tokens from the vault), e.g.
#   sentinel_people: { maria: "{{ sentinel_api_token_maria }}" }
sentinel_people: {}
# What the iOS app reaches. tailscale serve fronts 127.0.0.1:8070 with HTTPS.
sentinel_public_base_url: "https://services.example.ts.net"
sentinel_tailscale_serve: true

# Dashboard alert feed (optional; enabled when sentinel_dashboard_api_key is
# set in the vault). dashboard_url is the API base as reached from the
# services LXC; dashboard_public_url is what Safari on the phone opens.
dashboard_url: "http://dashboard:3001"
dashboard_public_url: "https://dashboard.example.ts.net"
dashboard_link_user_id: ""
dashboard_mark_seen: true
