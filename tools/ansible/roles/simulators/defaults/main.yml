---
# Simulator defaults — overrideable in inventory/host_vars/<host>.yml.
# (Role-internal constants live in vars/main.yml.)

# ts-store image version. EMPTY = "resolve the latest release at deploy time"
# (the role queries GitHub via gh and uses the newest tag). Set a concrete
# value here / in host_vars / via -e to PIN a version for reproducibility.
# There is deliberately no stale numeric fallback — an un-pinned deploy tracks
# the current release. Note: GHCR Docker tags strip the leading 'v' from the
# GitHub release tag (release v0.17.0 publishes image tag 0.17.0), so the role
# strips it when building tsstore_image.
tsstore_version: ""
tsstore_image: "ghcr.io/trv-enterprises/ts-store:{{ tsstore_version | regex_replace('^v', '') }}"

# Local source path (synced to remote). Assumes trv-homelab and
# trv-outpost-sim are sibling repos under the same parent. (Split out of
# the dashboard repo's dashboard/simulators/ into its own repo.)
simulators_source: "{{ playbook_dir }}/../../../../trv-outpost-sim"

# Data-writer behavior — adjust per environment as needed.
data_writer_interval_ms: 1000
data_writer_noise: "true"
data_writer_anomaly_rate: "0.002"

# Database seeder behavior.
db_num_sensors: 10
db_days_back: 7
db_interval_seconds: 60

# WebSocket simulator behavior.
ws_interval_ms: 1000
ws_num_sensors: 50
ws_enable_noise: "true"
ws_anomaly_rate: "0.002"

# REST API simulator behavior.
api_buffer_size: 1000
api_generate_ms: 5000

# Sensor-readings writer behavior (combined row-per-sensor schema store).
sensor_readings_interval_ms: 1000
sensor_readings_noise: "true"
sensor_readings_anomaly_rate: "0.002"

# Traffic-writer behavior (AWS-honeypot replay → WS stream + traffic-flows
# schema store). Host port is fixed at 21084 in the compose file (21084:8085).
traffic_events_per_sec: 50
traffic_store_name: "traffic-flows"
traffic_agg_write_sec: 60

# Counter-writer behavior (raw monotonic counters → counters schema store, a
# test source for the dashboard's accumulator/delta transform). Control HTTP
# host port is fixed at 21085 in the compose file (21085:8086).
counter_store_name: "counters"
counter_interval_ms: 1000
