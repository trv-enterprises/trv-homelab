---
# Simulators deployment tasks
# Syncs simulator source from dashboard repo, deploys .env, builds and starts services

- name: Validate simulator secrets
  ansible.builtin.fail:
    msg: "simulators_tsstore_admin_key and simulators_tsstore_api_key are required. Set in vault."
  when: >
    simulators_tsstore_admin_key is not defined or simulators_tsstore_admin_key == "" or
    simulators_tsstore_api_key is not defined or simulators_tsstore_api_key == ""

- name: Validate GHCR token
  ansible.builtin.fail:
    msg: "ghcr_token is required for pulling from GitHub Container Registry."
  when: ghcr_token is not defined or ghcr_token == ""

# Version resolution. Empty tsstore_version (the default) => resolve the LATEST
# ts-store release via the gh CLI on the control node, so an un-pinned deploy
# tracks current instead of a stale hardcoded tag. A concrete value pins and
# skips the lookup. tsstore_image strips any leading 'v' (GHCR tag convention).
- name: Note whether the simulators ts-store version was pinned
  ansible.builtin.set_fact:
    tsstore_version_pinned: "{{ (tsstore_version | default('') | length) > 0 }}"

- name: Resolve latest ts-store release (only when version not pinned)
  ansible.builtin.command:
    cmd: gh release view --repo trv-enterprises/ts-store --json tagName --jq .tagName
  delegate_to: localhost
  run_once: true
  check_mode: false
  register: sim_tsstore_latest
  changed_when: false
  failed_when: >-
    sim_tsstore_latest.rc != 0 or
    (sim_tsstore_latest.stdout | default('') | trim | length) == 0
  when: not tsstore_version_pinned

- name: Set tsstore_version to the resolved latest tag
  ansible.builtin.set_fact:
    tsstore_version: "{{ sim_tsstore_latest.stdout | trim }}"
  when: not tsstore_version_pinned

- name: Report the simulators ts-store version being deployed
  ansible.builtin.debug:
    msg: >-
      Deploying simulators ts-store image {{ tsstore_image }}
      {{ '(pinned)' if tsstore_version_pinned else '(latest, auto-resolved)' }}

- name: Login to GitHub Container Registry
  ansible.builtin.shell:
    cmd: echo "{{ ghcr_token }}" | docker login ghcr.io -u trv-enterprises --password-stdin
  register: docker_login
  changed_when: false
  no_log: true

- name: Create simulators deployment directory
  ansible.builtin.file:
    path: "{{ simulators_deploy_dir }}"
    state: directory
    mode: '0755'

- name: Sync simulator source to remote
  ansible.posix.synchronize:
    src: "{{ simulators_source }}/"
    dest: "{{ simulators_deploy_dir }}/"
    delete: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=.claude"
      - "--exclude=*.pyc"
      - "--exclude=__pycache__"
      - "--exclude=.DS_Store"
      - "--exclude=._*"
      - "--exclude=.env"
      - "--exclude=.env.example"

- name: Deploy simulators env file
  ansible.builtin.template:
    src: simulators.env.j2
    dest: "{{ simulators_deploy_dir }}/.env"
    mode: '0600'
  register: env_file

- name: Build Docker images
  ansible.builtin.command:
    cmd: docker compose build
    chdir: "{{ simulators_deploy_dir }}"
  register: build_result
  changed_when: "'Building' in build_result.stdout or 'Building' in build_result.stderr"

# Pull the ts-store image explicitly. Without this, `up -d` only pulls
# when the image is missing locally — so version bumps in defaults
# (e.g. v0.6.1 -> v0.6.2) would silently keep running the old image.
- name: Pull ts-store image
  ansible.builtin.command:
    cmd: docker compose pull tsstore
    chdir: "{{ simulators_deploy_dir }}"
  register: pull_result
  changed_when: "'Pulled' in pull_result.stderr or 'Downloaded' in pull_result.stderr"

- name: Start services
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ simulators_deploy_dir }}"
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

- name: Wait for ts-store to be healthy
  ansible.builtin.command:
    cmd: docker inspect simulators-tsstore --format '{{ '{{' }}.State.Health.Status{{ '}}' }}'
  register: health_check
  until: health_check.stdout == "healthy"
  retries: 15
  delay: 2
  changed_when: false

- name: Fix ts-store data volume ownership
  ansible.builtin.command:
    cmd: docker exec -u root simulators-tsstore chown tsstore:tsstore /data
  changed_when: false
  failed_when: false

# Adopt the shared simulator key into ts-store's central key REGISTRY.
#
# Before ts-store #138 each store carried its own keys.json and this role wrote
# those files directly. Post-#138 the registry (/data/keys.registry.json) is
# authoritative and per-store keys.json files are ignored, so the old approach
# silently produced a key with no grants — every schema-reconcile call 403'd
# ("API key lacks read access") and the deploy failed. Adopting registers the
# operator-minted key with real grants; the plaintext goes in over stdin so it
# never lands in argv or the process table.
#
# Wildcard grant: this is an isolated simulators container holding only
# synthetic data, and a glob means new sim stores need no key work at all.
#
# Idempotent: re-adopting an existing key exits non-zero with "already exists",
# which is a no-op, so the task tolerates it. Any OTHER failure is real and
# should stop the deploy.
- name: Adopt the shared simulator key into the ts-store key registry
  ansible.builtin.shell:
    cmd: >
      printf '%s' '{{ simulators_tsstore_api_key }}'
      | docker exec -i simulators-tsstore
      tsstore key create --key-file - --grant 'read,write,manage:*'
      --note 'Shared simulator key (Ansible)'
  register: key_adopt
  changed_when: key_adopt.rc == 0
  failed_when: >
    key_adopt.rc != 0 and
    ('already exists' not in (key_adopt.stderr | default('')) and
     'already exists' not in (key_adopt.stdout | default('')))
  no_log: true

- name: Get existing stores
  ansible.builtin.uri:
    url: "http://localhost:{{ tsstore_port }}/api/stores"
    method: GET
    headers:
      # The listing requires a store key (ts-store #138) — the admin key is the
      # server tier and holds no grants, so it is refused here by design.
      X-API-Key: "{{ simulators_tsstore_api_key }}"
    return_content: true
  register: stores_response
  ignore_errors: true

- name: Create location stores
  ansible.builtin.uri:
    url: "http://localhost:{{ tsstore_port }}/api/stores"
    method: POST
    headers:
      X-Admin-Key: "{{ simulators_tsstore_admin_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ item }}"
      num_blocks: 200000
      data_block_size: 512
      index_block_size: 4096
    status_code: [200, 201, 409]
  loop: "{{ simulators_tsstore_stores }}"
  # Entries are objects since ts-store #152 ({name, data_type, role, access}),
  # so map to names — comparing a name against an object never matches, which
  # made this task attempt a create (harmless 409) on every run.
  when: >
    stores_response is failed or
    stores_response.json.stores is not defined or
    item not in (stores_response.json.stores | map(attribute='name') | list)
  register: store_creation

# NOTE: per-store keys.json writing lived here until ts-store #138 moved key
# storage into the central registry (/data/keys.registry.json). Those files are
# ignored now — the shared key is adopted once, above, with a wildcard grant
# that covers every store this role creates. Nothing per-store to do.

# --- Combined "tidy" schema store(s) -----------------------------------------
# Created as type=schema. Schema application below is driven by ON-DISK STATE
# rather than the create task's `changed` flag, so it stays idempotent and
# self-healing: the schema is applied whenever the store has none yet.
#
# ts-store still mints a random "Initial key" per created store, but that is
# now just another registry entry — it does not shadow or conflict with the
# shared key adopted above, which carries its own grants.

# Create the schema store via the API. The type field is `data_type` (NOT
# `type`) — the same key the dashboard's ts-store client uses. ts-store rejects
# an unknown field rather than silently defaulting to a json store, so a wrong
# field name would fail loudly here.
- name: Create schema stores (only if absent)
  ansible.builtin.uri:
    url: "http://localhost:{{ tsstore_port }}/api/stores"
    method: POST
    headers:
      X-Admin-Key: "{{ simulators_tsstore_admin_key }}"
      Content-Type: application/json
    body_format: json
    body:
      name: "{{ item.key }}"
      data_type: schema
      num_blocks: 200000
      data_block_size: 512
      index_block_size: 4096
    status_code: [200, 201, 409]
  loop: "{{ simulators_tsstore_schema_stores | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: >
    stores_response is failed or
    stores_response.json.stores is not defined or
    item.key not in (stores_response.json.stores | map(attribute='name') | list)

# Previously this restarted ts-store so it would re-read per-store keys.json
# files. The registry is consulted live on every request (the CLI writes it,
# the server re-reads on change), so an adopted key needs no restart at all.
- name: Restart ts-store after creating stores
  ansible.builtin.command:
    cmd: docker compose restart tsstore
    chdir: "{{ simulators_deploy_dir }}"
  when: store_creation.changed

- name: Wait for ts-store to be healthy after key reload
  ansible.builtin.command:
    cmd: docker inspect simulators-tsstore --format '{{ '{{' }}.State.Health.Status{{ '}}' }}'
  register: health_recheck
  until: health_recheck.stdout == "healthy"
  retries: 15
  delay: 2
  changed_when: false
  when: store_creation.changed

# Apply the schema, authenticating with the store's own (now shared) API key —
# the admin key is rejected by this endpoint. Idempotent: a schema-type store
# with NO schema set yet returns HTTP 404 {"error":"no schema defined"} on GET
# (verified on v0.6.1); once a schema is set the GET returns 200 with the field
# list. We PUT only on the 404 case, so re-deploys never re-PUT (schema is
# immutable once set — a re-PUT would error).
- name: Check current schema of schema stores
  ansible.builtin.uri:
    url: "http://localhost:{{ tsstore_port }}/api/stores/{{ item.key }}/schema"
    method: GET
    headers:
      X-API-Key: "{{ simulators_tsstore_api_key }}"
    status_code: [200, 404]
  loop: "{{ simulators_tsstore_schema_stores | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: schema_current
  changed_when: false

- name: Apply schema to schema stores that have none
  ansible.builtin.uri:
    url: "http://localhost:{{ tsstore_port }}/api/stores/{{ item.item.key }}/schema"
    method: PUT
    headers:
      X-API-Key: "{{ simulators_tsstore_api_key }}"
    body_format: json
    body: "{{ item.item.value.schema }}"
    status_code: 200
  loop: "{{ schema_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.status == 404

- name: Show service status
  ansible.builtin.command:
    cmd: docker compose ps
    chdir: "{{ simulators_deploy_dir }}"
  register: status
  changed_when: false

- name: Display deployment status
  ansible.builtin.debug:
    msg: |
      Simulators deployed successfully!
      Directory: {{ simulators_deploy_dir }}
      Services:
      {{ status.stdout }}
