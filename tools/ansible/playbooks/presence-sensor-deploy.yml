---
# presence-sensor Collector Deployment Playbook
#
# Deploys the presence-sensor collector ONTO THE TS-STORE HOST. It
# subscribes to each presence sensor's Zigbee2MQTT state topic on the
# services broker and writes one tall record per publish (device, presence,
# pir_detection, illuminance, temperature, humidity, battery, voltage,
# linkquality) to a local `presence-sensors` schema store over the unix
# socket. The store, its schema, and its registry key grant are all
# created here on first run.
#
# The collector runs on the STORE's host, not the broker's: the write path
# stays local (no cross-host auth), and the unit is BindsTo/PartOf
# tsstore.service so it follows the store's lifecycle — the same
# arrangement as the shelly-ht collector on its host. The MQTT
# subscription is the remote leg; if the broker is unreachable there is
# nothing to capture anyway, and paho reconnects on its own.
#
# The binary is built locally from edge/presence-sensor (requires a Go
# toolchain on the control node) and pushed — not a release asset.
#
# Per-host config lives in host_vars/<host>.yml:
#   presence_sensor_broker    MQTT broker URL (tcp://<broker>:1883)
#   presence_sensor_devices   list of Z2M device names to capture
#   presence_sensor_api_key   store API key (1Password via op lookup)
#
# Usage:
#   ansible-playbook playbooks/presence-sensor-deploy.yml
#
# The default target is trv-srv-002; override with
# -e presence_sensor_host=<host>.

- name: Deploy presence-sensor collector
  hosts: "{{ presence_sensor_host | default('trv-srv-002') }}"
  become: false

  tasks:
    - name: Run presence-sensor collector role tasks
      ansible.builtin.include_role:
        name: tsstore
        tasks_from: presence-sensor.yml
